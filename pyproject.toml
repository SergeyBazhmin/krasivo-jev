[project]
name = "rujev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "loguru>=0.7.3",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "typer>=0.27.2",
]

[project.optional-dependencies]
# training and inference (`jev-model`); install with `uv sync --extra model`
model = [
    "torch>=2.6",
    "tqdm>=4.67",
    "transformers>=5.2",
]
# `jev-model ui`; install with `uv sync --extra model --extra ui`
ui = [
    "streamlit>=1.50",
]

[project.scripts]
jev = "jev_datasets.cli:app"
jev-model = "jev_model.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_datasets", "src/jev_model"]
