[project]
name = "rujev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "typer>=0.27.2",
]

[project.optional-dependencies]
# training and inference (`jev-model`); install with `uv sync --extra model`
model = [
    "flash-linear-attention>=0.5.2",
    "peft>=0.21.1",
    "torch>=2.6",
    "tqdm>=4.67",
    "transformers>=5.2",
    "unsloth>=2026.9.14",
]
# `jev-model ui`; install with `uv sync --extra model --extra ui`
ui = [
    "streamlit>=1.50",
]

[project.scripts]
jev = "jev_datasets.cli:app"
jev-model = "jev_model.cli:app"

[tool.uv]
# unsloth pins older torch, transformers and datasets than the project needs (Qwen3.5 itself needs transformers 5)
override-dependencies = ["datasets>=5.0.1", "torch>=2.14.0", "transformers>=5.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_datasets", "src/jev_model"]
