[project]
name = "krasivo-jev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "flash-linear-attention[cuda]>=0.5.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "peft>=0.21.1",
    "torch==2.10.*",
    "tqdm>=4.67",
    "transformers>=5.17.0",
    "typer>=0.27.2",
    "typesafe-sdk>=0.7.2",
]

[project.optional-dependencies]
# Flash Attention 2 for the pointer's full-attention layers and causal-conv1d for its linear-attention convs;
# prebuilt Linux x86_64 / Python 3.12 / torch 2.10 wheels (causal-conv1d has none for torch 2.11)
flash = [
    "flash-attn; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "causal-conv1d; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]

[project.scripts]
jev = "jev_datasets.cli:app"
jev-model = "jev_model.cli:app"
serve = "jev_vllm.serve:main"

# vLLM plugins (`src/jev_vllm/`) that serve an exported `pointer` run; the IO processor's name is the
# `io_processor_plugin` that `jev-model export` writes into `config.json`
[project.entry-points."vllm.general_plugins"]
jev_pointer = "jev_vllm:register_model"

[project.entry-points."vllm.io_processor_plugins"]
jev_pointer = "jev_vllm:io_processor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_datasets", "src/jev_model", "src/jev_vllm"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3+cu128torch2.10-cp312-cp312-linux_x86_64.whl" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0+cu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = [
    "B023",    # callbacks defined in a loop run within that iteration (zero_shot/evaluate.py)
    "DTZ005",  # run directory names use local time on purpose
]
