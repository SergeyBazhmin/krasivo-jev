[project]
name = "krasivo-jev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "flash-linear-attention[cuda]>=0.5.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "peft>=0.21.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "typer>=0.27.2",
    "typesafe-sdk>=0.7.2",
]

[project.optional-dependencies]
# training and inference (`jev-model`); install with `uv sync --extra model`
model = [
    "accelerate>=1.10",
    "flash-linear-attention>=0.5.2",
    "peft>=0.21.1",
    "torch>=2.6",
    "tqdm>=4.67",
    "transformers>=5.2",
]
# `jev-model ui`; install with `uv sync --extra model --extra ui`
ui = [
    "streamlit>=1.50",
]

[project.scripts]
jev = "jev_datasets.cli:app"
jev-model = "jev_model.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_datasets", "src/jev_model"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = [
    "B023",    # callbacks defined in a loop run within that iteration (zero_shot/evaluate.py)
    "BLE001",  # the UI shows any predictor error instead of crashing
    "DTZ005",  # run directory names use local time on purpose
]
